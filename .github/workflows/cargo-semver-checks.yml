name: cargo-semver-checks
permissions:
  contents: read
  pull-requests: read
on:
  pull_request: { paths: ['**/Cargo.toml'] }
  workflow_dispatch:
jobs:
  semver-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout # v4.1.1
      - uses: obi1kenobi/cargo-semver-checks-action@v2
