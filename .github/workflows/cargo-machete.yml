name: cargo-machete
permissions:
  contents: read
  pull-requests: read
on:
  push: { branches: [main], paths: ['Cargo.toml', '**/Cargo.toml'] }
  pull_request: { paths: ['Cargo.toml', '**/Cargo.toml'] }
  schedule: [{ cron: '47 6 * * 4' }]
  workflow_dispatch:
jobs:
  machete:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout # v4.1.1
      - uses: bnjbvr/cargo-machete@main
