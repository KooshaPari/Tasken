[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
    "Unlicense",
]

[bans]
multiple-versions = "deny"
skip = [
    { name = "getrandom", version = "0.2.17" },
    { name = "hashbrown", version = "0.15.5" },
    { name = "windows-sys", version = "0.60.2" },
    { name = "wit-bindgen", version = "0.51.0" },
]

[sources]
unknown-git = "deny"

[advisories]
ignore = []
